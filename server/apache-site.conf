# Apache virtual host for the droplet. setup-site.sh fills in __DOMAIN__ and
# __APP_DIR__ and copies the result to
# /etc/apache2/sites-available/__DOMAIN__.conf.
#
# Apache forwards every request to gunicorn on port 8000 (see
# server/gunicorn.conf.py), except the static files, which it serves itself.
# certbot later adds an HTTPS copy of this block and turns this one into a
# redirect to HTTPS.

<VirtualHost *:80>
    ServerName __DOMAIN__

    # Pass the visitor's Host header through so Flask builds correct URLs.
    ProxyPreserveHost On

    # Serve the JavaScript files straight from disk instead of through Python.
    # The "!" tells the proxy below to leave /static alone.
    Alias /static __APP_DIR__/app/static
    <Directory __APP_DIR__/app/static>
        Options -Indexes
        Require all granted
    </Directory>
    ProxyPass "/static" "!"

    # Forward everything else to gunicorn and rewrite any redirects it sends back.
    ProxyPass "/" "http://127.0.0.1:8000/"
    ProxyPassReverse "/" "http://127.0.0.1:8000/"

    # The research and generation pages stream progress for several minutes.
    # Apache's default of 60 seconds would cut those streams off.
    ProxyTimeout 600

    ErrorLog ${APACHE_LOG_DIR}/__DOMAIN__-error.log
    CustomLog ${APACHE_LOG_DIR}/__DOMAIN__-access.log combined
</VirtualHost>
