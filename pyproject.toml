[project]
name = "week06"
version = "0.1.0"
description = "Flask app that generates circular economy business model concepts from a short organization survey, with optional web research and prototype image generation"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.97.0",
    "flask>=3.1.3",
    "google-genai>=1.73.1",
    "gunicorn>=25.3.0",
    "posthog>=7.18.3",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.24",
]

[tool.uv]
# Take no package version published less than three days ago; poisoned
# releases are usually pulled within that window. Exempt one with
# exclude-newer-package = { name = "..." }.
exclude-newer = "P3D"
