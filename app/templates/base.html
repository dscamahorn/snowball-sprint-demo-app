<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Circular Concept{% endblock %}</title>

       This is PostHog's own loader snippet, pasted as-is. -->

      api_host: '{{ posthog.host }}',

  {% endif %}

  <!-- Google Fonts: Literata (serif headlines) + Nunito Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- DaisyUI component classes (must load before the Tailwind CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />

  <!-- Tailwind CSS Play CDN, with the Terra design tokens from docs/DESIGN.md -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            terra: {
              green: '#4a7c59',
              cream: '#faf6f0',
              'cream-dark': '#f0ebe2',
              amber: '#705c30',
              muted: '#8a8278',
              border: '#ddd8d0',
            }
          },
          fontFamily: {
            serif: ['Literata', 'Georgia', 'serif'],
            sans: ['Nunito Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            terra: '0 4px 20px rgba(46, 50, 48, 0.06)',
          },
        }
      }
    }
  </script>

  <!-- Alpine.js drives all page interactivity. "defer" makes it run after the
       page and our own scripts have loaded, so the component functions exist. -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <style>
    body { font-family: 'Nunito Sans', sans-serif; }
    h1, h2, h3 { font-family: 'Literata', serif; }
    textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(74,124,89,0.25); border-color: #4a7c59; }
  </style>

  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-terra-cream">

  <!-- Keyboard users can jump straight past the navigation. -->
  <a href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:rounded-lg focus:bg-terra-green focus:text-white">
    Skip to content
  </a>

  <nav class="bg-terra-cream border-b border-terra-border px-6 py-4 flex items-center justify-between" aria-label="Main">
    <a href="/" class="flex items-center gap-2 text-terra-green font-semibold tracking-wide no-underline group">
      <!-- Heroicon: arrow-path (recycling) -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        stroke-width="1.8" stroke="currentColor" aria-hidden="true"
        class="w-5 h-5 transition-transform duration-500 group-hover:rotate-180">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Circular Concept
    </a>
    {% block nav_right %}{% endblock %}
  </nav>

  <main id="main-content" class="{% block main_class %}container mx-auto px-4 py-12{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
